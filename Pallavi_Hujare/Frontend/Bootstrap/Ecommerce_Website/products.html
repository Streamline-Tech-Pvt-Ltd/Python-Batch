<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link rel="stylesheet" href="product.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
  
<section class="container py-5">

    <h2 class="text-center fw-bold mb-5">Featured Products</h2>

    <div class="row g-4">

        <div class="col-md-4">
            <div class="card product-card">

                <span class="badge bg-danger sale-badge">20% OFF</span>

                <img src="https://images.unsplash.com/photo-1592286927505-1def25115558?w=600"
                     class="card-img-top"
                     alt="iPhone">

                <div class="card-body text-center">

                    <h5 class="card-title">iPhone 17 Pro</h5>

                    <p class="text-muted mb-1">
                        <del>₹1,29,999</del>
                    </p>

                    <h4 class="text-primary fw-bold">
                        ₹1,09,999
                    </h4>

                    <button class="btn btn-dark w-100 mt-3">
                        Add to Cart
                    </button>

                </div>

            </div>
        </div>
        <div class="col-md-4">
            <div class="card product-card">
                <span class="badge bg-danger sale-badge">15% OFF</span>
                <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=600"
                     class="card-img-top"
                     alt="iPhone">
                <div class="card-body text-center">
                    <h5 class="card-title">iPhone 16 Pro</h5>
                    <p class="text-muted mb-1">
                        <del>₹99,999</del>
                    </p>
                    <h4 class="text-primary fw-bold">
                        ₹84,999
                    </h4>
                    <button class="btn btn-dark w-100 mt-3">
                        Add to Cart
                    </button>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card product-card">
                <span class="badge bg-danger sale-badge">10% OFF</span>
                <img src="https://images.unsplash.com/photo-1603899122634-f086ca5f5ddd?w=600"
                     class="card-img-top"
                     alt="iPhone">
                <div class="card-body text-center">
                    <h5 class="card-title">iPhone 15</h5>
                    <p class="text-muted mb-1">
                        <del>₹79,999</del>
                    </p>
                    <h4 class="text-primary fw-bold">
                        ₹71,999
                    </h4>
                    <button class="btn btn-dark w-100 mt-3">
                        Add to Cart
                    </button>
                </div>
            </div>
        </div>
    </div>
</section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
