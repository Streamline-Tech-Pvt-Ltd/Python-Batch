</div>

<div class="contact-container">

<div class="contact-info">

<div class="contact-card">
<i class="bi bi-envelope-fill"></i>

<div>
<h4>Email</h4>
<p>pallavihujare123@gmail.com</p>
</div>

</div>

<div class="contact-card">
<i class="bi bi-telephone-fill"></i>

<div>
<h4>Phone</h4>
<p>+91 9699158082</p>
</div>

</div>

<div class="contact-card">
<i class="bi bi-geo-alt-fill"></i>

</div>

</div>

<a href="https://github.com/pallavihujare123-cell" target="_blank">

</button>
</form>

</div>
</div>
</section>
