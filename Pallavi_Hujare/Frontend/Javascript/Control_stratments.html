<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        

        //break statement : Exit loop Completely
        for(i= 0;i<10;i++){
            if(i ===3){
                break;
            }
            console.log(i);
        }

        //countinue statement : Skip Current Iteration
        for(i= 0;i<10;i++){
            if(i ===3){
                continue;
            }
            text += "+ i + ";
            console.log(text);
        }

        //Switch Statement : The switch statement is used when you want to compare one value with multiple possible cases.
            let day = 2;

    switch (day) {
        case 1:
            console.log("Monday");
            break;

        case 2:
            console.log("Tuesday");
            break;

        case 3:
            console.log("Wednesday");
            break;

        default:
            console.log("Invalid day");
    }

    </script>
</body>
</html>
