<!DOCTYPE html>
<html>
<head>
    <title>Student Form</title>
</head>
<body>

<form>

<label>Name :</label>
<input type="text" id="name" placeholder="Enter Your Name">
<br><br>

<label>Class :</label>
<input type="text" id="class" placeholder="Enter Your Class">
<br><br>

<label>Gender :</label>
<input type="radio" name="gender" id="male" value="Male"> Male
<input type="radio" name="gender" id="female" value="Female"> Female
<br><br>

<label>Skill :</label>
<input type="checkbox" id="html" value="HTML"> HTML
<input type="checkbox" id="css" value="CSS"> CSS
<input type="checkbox" id="javascript" value="JavaScript"> JavaScript
<input type="checkbox" id="python" value="Python"> Python
<br><br>

<label>City :</label>
<select name="city" id="city">
    <option value="">Select City</option>
    <option value="nashik">Nashik</option>
    <option value="pune">Pune</option>
    <option value="mumbai">Mumbai</option>
</select>
<br><br>

<label>Address :</label><br>
<textarea name="address" rows="3" cols="40" placeholder="Write your Address"></textarea>
<br><br>

<input type="submit" value="Submit">
<input type="Reset" value="Reset">
</form>

</body>
</html>
