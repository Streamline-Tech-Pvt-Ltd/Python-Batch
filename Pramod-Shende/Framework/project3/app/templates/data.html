<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
        }

    </style>
</head>
<body>
   <table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Dept</th>
        <th>salary</th>
        <th>Start Date</th>
        <th>End Date</th>
    </tr>

    {% for i  in interns_list %}
    
    <tr>
        <td>{{i.id}}</td>
        <td>{{i.name}}</td>
        <td>{{i.dept}}</td>
        <td>{{i.salary}}</td>
        <td>{{i.s_date}}</td>
        <td>{{i.e_date}}</td>
    </tr>

    {%endfor%}
    
   </table>
</body>
</html>
