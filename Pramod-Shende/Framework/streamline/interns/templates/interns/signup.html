{% extends "interns/base.html" %}

{% load static %}

{% block title %}Sign Up{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'interns/css/signup.css' %}">
<div class="signup-container">
<div class="signup-card">
<h1>Create Account</h1>
<form method="post">
{% csrf_token %}
{{ form.as_p }}
<button type="submit" class="signup-btn">sign up</button>
</form>
</div>
{% if form.errors %}
<div style="color:red;">
{{ form.errors }}
</div>
{% endif %}
</div>
{% endblock %}
