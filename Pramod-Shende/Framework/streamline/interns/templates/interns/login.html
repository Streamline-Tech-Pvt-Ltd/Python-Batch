{% extends 'interns/base.html' %}

{% block title %}Login{% endblock %}

{% block content %}

<div style="
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f8f9fa;">

    <div style="
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;">

        <h2 style="margin-bottom: 20px;">Login</h2>

        <form method="post">
            {% csrf_token %}

            <table style="width: 100%; margin-bottom: 15px; text-align: left;">

                <tr>
                    <td style="padding: 8px;">
                        <label for="{{ form.username.id_for_label }}">
                            Username :
                        </label>
                    </td>

                    <td style="padding: 8px;">
                        <input type="text" name="username" required id="{{ form.username.id_for_label }}" style="
                                width: 100%;
                                padding: 8px;
                                border: 1px solid #ced4da;
                                border-radius: 4px;
                                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);">
                    </td>
                </tr>
                <tr>
                    <td style="padding: 8px;">
                        <label for="{{ form.password.id_for_label }}">
                            Password :
                        </label>
                    </td>
                    <td style="padding: 8px;">
                        <input type="password" name="password" required id="{{ form.password.id_for_label }}" style="
                                width: 100%;
                                padding: 8px;
                                border: 1px solid #ced4da;
                                border-radius: 4px;
                                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);">
                    </td>
                </tr>

            </table>

            <button type="submit" style="
                    margin-top: 10px;
                    padding: 10px 20px;
                    background-color: #28a745;
                    color: #ffffff;
                    border: none;
                    border-radius: 4px;
                    cursor: pointer;
                    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);">
                Login
            </button>
        </form>
        <p style="margin-top: 15px;">
            Don't have an account?
            <a href="{% url 'signup' %}" style="color: #007bff; text-decoration: none;">
                Sign up here
            </a>
        </p>
    </div>
</div>

{% endblock %}
