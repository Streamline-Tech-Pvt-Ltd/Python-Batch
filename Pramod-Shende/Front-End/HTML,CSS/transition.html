<!DOCTYPE html>
<html>
<head>
<title> div element </title>
<style>

.linear,.ease,.ease-in,.ease-out,.ease-in-out{
background-color:red;
height:200px;
width:50px;
transition-hover:2s;
transition-property:width;
transition-duration:1s;
transition-timing-function:linear;
transition-delay:0.5s;
}

div:hover{
width:70%;
}

</style>
</head>
<body>
<div class="linear">
	<h1>highlighted line for linear.</h1>
</div>

<div class="ease">
	<h1>highlighted line for ease.</h1>
</div>

<div class="ease-out">
	<h1>highlighted line for ease-out.</h1>
</div>

<div class="ease-in">
	<h1>highlighted line for ease-in.</h1>
</div>

<div class="ease-in-out">
	<h1>highlighted line for ease-in-out.</h1>
</div>


</body>
</html>
