<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js3</title>
</head>
<body>
    <script>
        let marks = 75;

        if (marks >= 80) {
            console.log("Grade A");
        }
        else if (marks >= 60 && marks <= 79) {
            console.log("Grade B");
        }
        else if (marks >= 40 && marks <= 59) {
            console.log("Grade C");
        }
        else {
            console.log("Fail");
        }
        
    </script>
</body>
</html>
