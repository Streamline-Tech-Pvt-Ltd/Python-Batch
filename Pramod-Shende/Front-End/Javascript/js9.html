<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        //parameters and arguments:
        function add(a, b) {
            console.log("the addition of a and b is : ", a + b);
        }
        let c = add(8, 5);

        //function expression:
        const calculatesalary = function (basic, bonus) {
            return basic + bonus;
        }

        console.log("salary :", calculatesalary(20000, 5000));

        //arrow function:
        const addition = (a, b) => a + b;
        console.log(addition(9, 2));

        //use of this keyword:
        const person = {
            name: "pramod",
            greet: function () {
                return "my name is:" + this.name;
            }
        }
        console.log(person.greet());

        //find the function through factorial number

        function factorial(n) {
            let fact = 1;
            let i = 1;

            while (i <= n) {
                fact *= i;
                i++;
            }

            return fact;
        }

        console.log(factorial(5));



    </script>
</body>

</html>
