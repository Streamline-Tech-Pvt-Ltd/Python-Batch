<!DOCTYPE html>
<html>
<head>
    <title>table alignment</title>
    <link href="style1.css" rel="stylesheet">
</head>
<body>
    <table>
	<tr>
		<th>1</th>
		<th>2</th>
		<th>3</th>
		<th>4</th>
		<th>5</th>
		<th>6</th>
		<th>7</th>
	</tr>
	
	<tr>
		<th colspan="5">Reciept Type</th>
		<th colspan="2">Reciept no</th>
	</tr>
	
	<tr>
		<th colspan="4">Paid by</th>
		<th colspan="3">Paid to</th>
	</tr>
	
	<tr>

		<th colspan="5">Description</th>
		<th colspan="2">Amount</th>
	</tr>
	
	<tr>
		<th rowspan="5" colspan="5"></th>
		<th> </th>
		<th> </th>
	</tr>

	<tr>
		<th>Subtotal</th>
		<th> </th>
	</tr>
	
	<tr>
		<th>Discount</th>
		<th></th>
	</tr>

	<tr>
		<th>Tax</th>
		<th></th>
	</tr>
	<tr>
		<th>Total</th>
		<th></th>
	</tr>
	<tr>
		<th colspan="4">Date</th>
		<th colspan="3">Recieved by:</th>
	</tr>
    </table>
</body>
</html>
