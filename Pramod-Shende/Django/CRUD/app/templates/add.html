{% extends "templates/index.html" %}

{% block title %}add{% endblock %}

{% block content %}


<div class="modal fade" id="addModal" tabindex="-1">

    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Add New Intern
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <form method="POST">
                {% csrf_token %}

                <div class="modal-body">

                    <div class="mb-3">
                        <label>Name</label>

                        <input
                            type="text"
                            name="name"
                            class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>Email</label>

                        <input
                            type="email"
                            name="email"
                            class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>Phone</label>

                        <input
                            type="text"
                            name="phone"
                            class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>Department</label>

                        <input
                            type="text"
                            name="department"
                            class="form-control">
                    </div>

                </div>

                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">
                        Close
                    </button>

                    <button
                        type="submit"
                        name="add"
                        class="btn btn-primary">
                        Save
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>


{% endblock %}
