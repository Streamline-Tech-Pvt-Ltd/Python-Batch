{% extends "templates/index.html" %}

{% block title %}update{% endblock %}

{% block content %}

            <div
                class="modal fade"
                id="editModal_{{ intern.id }}"
                tabindex="-1">

                <div class="modal-dialog">
                    <div class="modal-content">

                        <div class="modal-header">
                            <h5 class="modal-title">
                                Edit Intern
                            </h5>

                            <button
                                type="button"
                                class="btn-close"
                                data-bs-dismiss="modal">
                            </button>
                        </div>

                        <form method="POST">

                            {% csrf_token %}

                            <input
                                type="hidden"
                                name="intern_id"
                                value="{{ intern.id }}">

                            <div class="modal-body">

                                <div class="mb-3">
                                    <label>Name</label>

                                    <input
                                        type="text"
                                        name="name"
                                        class="form-control"
                                        value="{{ intern.name }}">
                                </div>

                                <div class="mb-3">
                                    <label>Email</label>

                                    <input
                                        type="email"
                                        name="email"
                                        class="form-control"
                                        value="{{ intern.email }}">
                                </div>

                                <div class="mb-3">
                                    <label>Phone</label>

                                    <input
                                        type="text"
                                        name="phone"
                                        class="form-control"
                                        value="{{ intern.phone }}">
                                </div>

                                <div class="mb-3">
                                    <label>Department</label>

                                    <input
                                        type="text"
                                        name="department"
                                        class="form-control"
                                        value="{{ intern.department }}">
                                </div>

                            </div>

                            <div class="modal-footer">

                                <button
                                    type="button"
                                    class="btn btn-secondary"
                                    data-bs-dismiss="modal">
                                    Close
                                </button>

                                <button
                                    type="submit"
                                    name="update"
                                    class="btn btn-primary">
                                    Save Changes
                                </button>

                            </div>

                        </form>

                    </div>
                </div>
            </div>

{% endblock %}
