<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Data</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #4facfe, #00f2fe);
        padding: 40px;
      }

      /* Table styling */
      table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
      }

      /* Header */
      th {
        background: #4facfe;
        color: white;
        padding: 12px;
        text-align: center;
        font-size: 14px;
      }

      /* Table cells */
      td {
        padding: 10px;
        text-align: center;
        border-bottom: 1px solid #ddd;
      }

      /* Alternate rows */
      tr:nth-child(even) {
        background: #f2f2f2;
      }

      /* Hover effect */
      tr:hover {
        background: #e6f2ff;
        transition: 0.3s;
      }

      /* Responsive table */
      table {
        display: block;
        overflow-x: auto;
      }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
            </tr>
        </thead>
        <tbody>
            {% for user in data %}
            <tr>
                <td>{{ user.id }}</td>
                <td>{{ user.name.firstname }} {{ user.name.lastname }}</td>
                <td>{{ user.email }}</td>
                <td>{{ user.phone }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
