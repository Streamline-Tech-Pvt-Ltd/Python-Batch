<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart | Giftora</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- PROFESSIONAL GIFTORA NAVBAR -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">

            <!-- Brand Logo -->
            <a class="navbar-brand" href="index.html">
                Giftora <span>♡</span>
            </a>

            <!-- Mobile Menu Button -->
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#cartNavbar"
                aria-controls="cartNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navigation Links -->
            <div class="collapse navbar-collapse" id="cartNavbar">

                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="shop.html">
                            Shop
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="wishlist.html">
                             Wishlist
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="gift-finder.html">
                             Gift Finder
                        </a>
                    </li>

                    <li class="nav-item ms-lg-2">
                        <a
                            class="btn btn-outline-dark rounded-pill"
                            href="cart.html"
                            aria-current="page">
                            🛍️ My Cart
                        </a>
                    </li>

                </ul>

            </div>

        </div>
    </nav>


    <!-- CART PAGE HEADER -->
    <header class="py-5 text-center">
        <div class="container">

            <p class="text-uppercase fw-semibold">
                Your Special Selections
            </p>

            <h1 class="display-5 fw-bold">
                🛍️ Your Shopping Cart
            </h1>

            <p class="text-muted mb-0">
                Your perfect gifts are waiting for you!
            </p>

        </div>
    </header>


    <!-- CART CONTENT -->
    <main class="container py-5">

        <div class="row g-4">

            <!-- Cart Products -->
            <div class="col-lg-8">

                <div id="cartItems">
                    <!-- Cart products will appear here -->
                </div>

            </div>


            <!-- Order Summary -->
            <div class="col-lg-4">

                <div class="card p-4 shadow-sm">

                    <h4 class="fw-bold">
                        Order Summary
                    </h4>

                    <hr>

                    <div class="d-flex justify-content-between">
                        <span>Total Items:</span>
                        <span id="totalItems">0</span>
                    </div>

                    <div class="d-flex justify-content-between mt-3">
                        <span>Total Amount:</span>
                        <strong id="totalAmount">₹0</strong>
                    </div>

                    <button
                        type="button"
                        class="btn btn-primary w-100 mt-4"
                        id="checkoutBtn">

                        Proceed to Checkout
                    </button>

                    <a
                        href="shop.html"
                        class="btn btn-outline-secondary w-100 mt-2">

                        Continue Shopping
                    </a>

                </div>

            </div>

        </div>

    </main>


    <!-- Bootstrap JavaScript: Required for Mobile Navbar -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Product Data -->
    <script src="../js/products.js"></script>

    <!-- Main JavaScript -->
    <script src="../js/main.js"></script>

</body>

</html>
