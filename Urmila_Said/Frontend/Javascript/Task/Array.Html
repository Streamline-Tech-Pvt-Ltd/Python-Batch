    <script>
        // 1.This Keyword
        const student = {
            name: "Urmila",

                console.log(this.age);
            }
        };
        student.display();

        // 2.Array
        const fruit = ["Apple","Banana","Mango","KIWI"];
        console.log(fruit);

 
        // 3.length
        const fruits = ["Apple","Banana","Mango","KIWI"];
        let count = fruits.length;
        console.log(count);

        const fruits1 = ["Apple","Banana","Mango","KIWI"];

        console.log(removed);

        const name = ["Urmila","Mayuri","Shivani","Pallavi"];

        const names = ["Urmila","Mayuri","Shivani","Pallavi"];

        console.log(result1);

        intern.sort;
        console.log(intern);

        // 9.filter
        const num1 = [21, 65, 34, 18, 15, 10, 66]
        const age = num1.filter(myfunction);
        function myfunction(value) {
            return value >= 18;
        }
        console.log(age);
