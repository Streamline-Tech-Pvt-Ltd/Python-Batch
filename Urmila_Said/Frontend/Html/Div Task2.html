<!DOCTYPE html>
<html>
<head>
<style>

.box{
    width:150px;
    height:150px;
    display:inline-block;
    margin:10px;
    padding:10px;
    text-align:center;
    color:white;
}

.red{background:red;}
.blue{background:blue;}
.green{background:green;}

.box:hover{
    background:black;
}
</style>
</head>

<body>

<div class="box red">
    <h3>HTML</h3>
    <p>Web pages</p>
</div>

<div class="box blue">
    <h3>CSS</h3>
    <p>Styling</p>
</div>

<div class="box green">
    <h3>JS</h3>
    <p>Interactive</p>
</div>

</body>
</html>
